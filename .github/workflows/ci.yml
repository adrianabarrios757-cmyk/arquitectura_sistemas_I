name: Verificacion HW-05
on:
  push:
    branches: [hw-05]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm install
      - name: Compilar monorepo
        run: npm run build
      - name: Ejecutar pruebas
        run: npm run test
